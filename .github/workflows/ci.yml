name: CI

on:
  push:
    branches: [ "main", "dev", "tests" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-backend:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
        
      - name: Format Check (Ruff)
        run: ruff format --check app/
        
      - name: Lint (Ruff)
        run: ruff check app/
        
      - name: Type Check (Mypy)
        run: mypy app/

  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint (Oxlint)
        run: npm run lint
        
      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
        
      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://helpdesk:changeme@localhost:5432/helpdesk_test
          DATABASE_URL: postgresql://helpdesk:changeme@localhost:5432/helpdesk_test
          JWT_SECRET: "testsecret123"
          GEMINI_API_KEY: "dummy_test_key"
        run: pytest tests/ -v
